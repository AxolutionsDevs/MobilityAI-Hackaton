version: "3.9"

services:
  backend:
    build: ./backend
    container_name: railway-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - railway-net

  frontend:
    build: ./frontend
    container_name: railway-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - railway-net

networks:
  railway-net:
    driver: bridge


